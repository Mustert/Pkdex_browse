<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">
  <!-- transparent plastic sleeve body -->
  <rect x="2" y="2" width="36" height="52" rx="5" ry="5"
        fill="#eaf7ff" fill-opacity="0.18" stroke="#8fd0f2" stroke-width="1.5" />

  <!-- thumb notch -->
  <path d="M16.5 2 a3.5 3.5 0 0 0 7 0" fill="none" stroke="#8fd0f2" stroke-width="1.2" />

  <!-- pokemon card back -->
  <rect x="6" y="6" width="28" height="44" rx="3" ry="3" fill="#16305c" stroke="#3a6ea8" stroke-width="1" />
  <rect x="8" y="8" width="24" height="40" rx="2" ry="2" fill="none" stroke="#5b8fc9" stroke-opacity="0.7" stroke-width="0.75" />

  <!-- pokeball emblem -->
  <g transform="translate(20 28)">
    <path d="M -9 0 A 9 9 0 0 1 9 0 Z" fill="#e6473c" stroke="#111111" stroke-width="1.1" />
    <path d="M -9 0 A 9 9 0 0 0 9 0 Z" fill="#ffffff" stroke="#111111" stroke-width="1.1" />
    <rect x="-9" y="-0.7" width="18" height="1.4" fill="#111111" />
    <circle cx="0" cy="0" r="3.2" fill="#ffffff" stroke="#111111" stroke-width="1.1" />
    <circle cx="0" cy="0" r="1.3" fill="#111111" />
  </g>

  <!-- glossy highlight streak -->
  <polygon points="7,4.5 15,4.5 8,32 5,32" fill="#ffffff" fill-opacity="0.30" />
</svg>
