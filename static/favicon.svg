<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" shape-rendering="crispEdges">
  <!-- binder spine -->
  <rect x="0" y="0" width="3" height="18" fill="#8b2e2e" />
  <rect x="1" y="3" width="1" height="1" fill="#3a1010" />
  <rect x="1" y="8" width="1" height="1" fill="#3a1010" />
  <rect x="1" y="13" width="1" height="1" fill="#3a1010" />

  <!-- binder page -->
  <rect x="3" y="0" width="15" height="18" fill="#f2e6c9" />
