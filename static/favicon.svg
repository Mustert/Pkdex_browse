  <!-- 3x3 grid of pokemon cards -->
  <rect x="5" y="3" width="3" height="3" fill="#e74c3c" />
  <rect x="9" y="3" width="3" height="3" fill="#3498db" />
  <rect x="13" y="3" width="3" height="3" fill="#2ecc71" />

  <rect x="5" y="7" width="3" height="3" fill="#f1c40f" />
  <rect x="9" y="7" width="3" height="3" fill="#e84393" />
  <rect x="13" y="7" width="3" height="3" fill="#6c3483" />

  <rect x="5" y="11" width="3" height="3" fill="#63d1e0" />
  <rect x="9" y="11" width="3" height="3" fill="#d35400" />
  <rect x="13" y="11" width="3" height="3" fill="#b5a642" />
</svg>
